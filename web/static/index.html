<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Folio - PDF tools</title>
  <meta name="description" content="Combine images into a PDF, merge PDFs and add watermarks. Files are deleted as soon as the job ends.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><img src="favicon.svg" alt="" width="24" height="24">Folio</a>
    <span class="note">Files are deleted as soon as the job ends</span>
  </header>

  <main>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>

    <nav class="tabs" role="tablist" aria-label="Tools">
      <button role="tab" type="button" data-tool="images">Images to PDF</button>
      <button role="tab" type="button" data-tool="merge">Merge PDFs</button>
      <button role="tab" type="button" data-tool="watermark">Watermark</button>
    </nav>

    <form id="form" class="workspace" novalidate>
      <section class="column">
        <label class="drop" id="drop">
          <input type="file" id="picker" multiple>
          <strong id="drop-title"></strong>
          <span id="drop-hint"></span>
        </label>
        <ul class="files" id="files"></ul>

        <fieldset class="options" data-for="images" hidden>
          <label>Page size
            <select name="page_size" id="page-size">
              <option value="A4">A4</option>
              <option value="Letter">Letter</option>
              <option value="fit">Match image</option>
            </select>
          </label>
          <label>Orientation
            <select name="orientation">
              <option value="portrait">Portrait</option>
              <option value="landscape">Landscape</option>
            </select>
          </label>
          <label>Margin
            <select name="margin">
              <option value="true">Small</option>
              <option value="false">None</option>
            </select>
          </label>
        </fieldset>

        <fieldset class="options" data-for="watermark" hidden>
          <div class="segmented wide" role="radiogroup" aria-label="Watermark type">
            <label><input type="radio" name="wm_kind" value="text" checked><span>Text</span></label>
            <label><input type="radio" name="wm_kind" value="image"><span>Image</span></label>
          </div>
          <label class="wide" data-kind="text">Text
            <input type="text" name="text" id="wm-text" maxlength="200" value="CONFIDENTIAL" autocomplete="off">
          </label>
          <label class="wide" data-kind="image" hidden>Image
            <input type="file" id="wm-image" accept="image/png,image/jpeg,image/webp,image/tiff">
          </label>
          <label>Layout
            <select name="layout" id="wm-layout">
              <option value="center">Centered</option>
              <option value="tiled">Tiled</option>
            </select>
          </label>
          <label data-kind="text">Color
            <input type="color" name="color" id="wm-color" value="#808080">
          </label>
          <label>Opacity <output id="wm-opacity-out"></output>
            <input type="range" name="opacity" id="wm-opacity" min="0.05" max="1" step="0.05" value="0.3">
          </label>
          <label>Rotation <output id="wm-rotation-out"></output>
            <input type="range" name="rotation" id="wm-rotation" min="-90" max="90" step="5" value="45">
          </label>
          <label>Size <output id="wm-size-out"></output>
            <input type="range" name="size" id="wm-size" min="0.15" max="1" step="0.05" value="0.6">
          </label>
          <label>Pages
            <input type="text" name="pages" placeholder="All, or 1-3,7" autocomplete="off">
          </label>
        </fieldset>

        <p class="error" id="error" role="alert" hidden></p>
        <div class="actions">
          <button type="submit" class="primary" id="submit" disabled></button>
          <a class="result" id="result" hidden>Download again</a>
        </div>
      </section>

      <aside class="preview" id="preview" hidden aria-label="Watermark preview">
        <div class="sheet" id="sheet"></div>
        <p>Approximate preview</p>
      </aside>
    </form>
  </main>

  <footer id="limits"></footer>
  <script src="app.js"></script>
</body>
</html>
